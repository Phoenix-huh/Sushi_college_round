<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Patchwork</title>
  <style>
    body {
      width: 300px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
      margin: 0;
      color: #333;
    }
    h2 {
      margin-top: 0;
      font-size: 18px;
      color: #4f46e5;
    }
    p {
      font-size: 14px;
      color: #555;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover {
      background: #4338ca;
    }
    .dashboard-link {
      display: block;
      margin-top: 16px;
      text-align: center;
      font-size: 12px;
      color: #6366f1;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h2>Patchwork</h2>
  <p>To create patches visually, right-click any element on the page and we will generate the structural anchors.</p>
  <button id="toggle-preview" class="btn">Toggle Preview Mode</button>
  
  <a href="http://localhost:5173" target="_blank" class="dashboard-link">Open Dashboard</a>

  <script type="module" src="./src/popup.ts"></script>
</body>
</html>
